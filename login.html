<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>تسجيل الدخول</title><style>*{font-family:'Cairo',sans-serif;margin:0;padding:0;box-sizing:border-box}body{background:#0a0a0a;color:#fff;display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px}.login-box{background:#1a1a1a;padding:50px;border-radius:20px;border:2px solid #4285F4;max-width:450px;width:100%}h1{font-size:32px;margin-bottom:10px;text-align:center}.form-group{margin-bottom:25px}label{display:block;margin-bottom:10px;font-weight:700}input{width:100%;padding:18px;background:#0a0a0a;border:2px solid #333;border-radius:10px;color:#fff;font-size:16px}.btn{background:#4285F4;color:#fff;padding:18px;border:none;border-radius:10px;font-size:18px;font-weight:900;cursor:pointer;width:100%}</style></head><body><div class="login-box"><h1>🔐 تسجيل الدخول</h1><div class="form-group"><label>البريد الإلكتروني</label><input type="email" id="email"></div><div class="form-group"><label>كلمة المرور</label><input type="password" id="password"></div><button class="btn" onclick="login()">دخول</button></div><script>async function login(){const email=document.getElementById('email').value;const password=document.getElementById('password').value;const deviceInfo={user_agent:navigator.userAgent};const res=await fetch('/api/user/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email,password,deviceInfo})});const data=await res.json();if(data.success){document.cookie=`session=${data.session_token}; max-age=2592000; path=/`;location.href='/dashboard.html';}else{alert(data.error);}}</script></body></html>

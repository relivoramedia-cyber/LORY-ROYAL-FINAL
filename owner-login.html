<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><title>دخول المالك</title><style>*{font-family:'Cairo',sans-serif}body{background:#0a0a0a;color:#fff;display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px}.login-box{background:#1a1a1a;padding:50px;border-radius:20px;border:2px solid #4285F4;max-width:500px;width:100%}input{width:100%;padding:18px;background:#0a0a0a;border:2px solid #333;border-radius:10px;color:#fff;font-size:18px;margin:10px 0}.btn{background:#4285F4;color:#fff;padding:20px;border:none;border-radius:10px;font-size:20px;font-weight:900;cursor:pointer;width:100%}</style></head><body><div class="login-box"><h1>🔐 دخول المالك</h1><input type="password" id="password" placeholder="تاريخ الميلاد" maxlength="8"><button class="btn" onclick="checkPassword()">دخول</button></div><script>function checkPassword(){if(document.getElementById('password').value==='03011983'){alert('صح - ضيف OTP هنا');}else{alert('كلمة مرور خطأ');}}</script></body></html>

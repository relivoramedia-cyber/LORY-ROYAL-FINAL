<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>لوحة التحكم</title><style>*{font-family:'Cairo',sans-serif;margin:0;padding:0;box-sizing:border-box}body{background:#0a0a0a;color:#fff;padding:40px}.header{display:flex;justify-content:space-between;align-items:center;margin-bottom:40px}h1{font-size:36px}.card{background:#1a1a1a;padding:30px;margin:20px 0;border-radius:15px;border:1px solid #333}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:20px}.stat{font-size:48px;font-weight:900;color:#4285F4}.btn{background:#4285F4;color:#fff;padding:15px 30px;border:none;border-radius:10px;font-size:16px;cursor:pointer;margin:5px;text-decoration:none;display:inline-block}</style></head><body><div class="header"><h1>👑 لوحة التحكم</h1><button class="btn" onclick="logout()">تسجيل خروج</button></div><div class="grid"><div class="card"><h3>📊 إحصائياتك</h3><div class="stat" id="postCount">0</div><p>منشورات</p></div><div class="card"><h3>💎 باقتك</h3><div class="stat" id="tierName">FREE</div></div><div class="card"><h3>🤖 AI المتبقي</h3><div class="stat" id="aiLeft">50</div></div></div><script>const token=document.cookie.split('; ').find(r=>r.startsWith('session='))?.split('=')[1];if(!token)location.href='/login.html';fetch('/api/user/stats',{headers:{'Authorization':'Bearer '+token}}).then(r=>r.json()).then(d=>{document.getElementById('postCount').textContent=d.posts||0;document.getElementById('tierName').textContent=d.tier||'FREE';document.getElementById('aiLeft').textContent=d.ai_requests_left||0;});function logout(){document.cookie='session=; max-age=0; path=/';location.href='/';}</script></body></html>
